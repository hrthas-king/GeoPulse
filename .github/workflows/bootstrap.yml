name: Import validated GeoPulse sources

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify archive and extract the expected source files
        shell: python
        run: |
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / 'GeoPulse-v0.1.0-source.zip'
          expected_hash = '62535e7c8dc0117ceed1a5cc8359bed228466c82e129d088f00ee9c9ce9697e3'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected_hash:
              raise RuntimeError('Source archive SHA256 mismatch')
          expected = set(json.loads('[".gitattributes",".github/workflows/ci.yml",".github/workflows/release.yml",".gitignore","LICENSE","README.md","cmd/geopulse/main_windows.go","docs/ARCHITECTURE.md","docs/VALIDATION.md","docs/screenshots/README.md","go.mod","internal/app/engine.go","internal/app/engine_test.go","internal/config/config.go","internal/ipinfo/fetch_windows.go","internal/ipinfo/trace.go","internal/ipinfo/trace_test.go","internal/monitor/state.go","internal/monitor/state_test.go","internal/network/layout_windows_test.go","internal/network/network_windows.go","internal/startup/startup_windows.go","internal/ui/layout_windows_test.go","internal/ui/presentation.go","internal/ui/presentation_test.go","internal/ui/tray_windows.go","internal/winapi/api_windows.go","internal/winapi/process_windows.go","scripts/build.ps1","scripts/package.ps1","scripts/verify.ps1"]'))
          with zipfile.ZipFile(archive) as source:
              entries = [entry for entry in source.infolist() if not entry.is_dir()]
              if len(entries) != len(expected) or {entry.filename for entry in entries} != expected:
                  raise RuntimeError('Unexpected or missing source archive entries')
              for entry in entries:
                  target = (root / entry.filename).resolve()
                  if not target.is_relative_to(root) or entry.file_size > 1024 * 1024:
                      raise RuntimeError('Unsafe source archive entry')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read(entry))
          print('Verified and extracted 31 source files')
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Test, vet and build both architectures
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Commit verified source tree and remove upload helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath 'GeoPulse-v0.1.0-source.zip', '.github/workflows/bootstrap.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: import validated GeoPulse source tree'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Source push failed' }
