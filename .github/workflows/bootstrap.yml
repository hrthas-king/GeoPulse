name: Import validated GeoPulse sources

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify archive and extract the expected source files
        shell: python
        run: |
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / 'GeoPulse-v0.1.1-source.zip'
          expected_hash = '0c1f503311b263586168cd89a5a6203fead1dc0af7c5b7d454fb925182233f4a'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected_hash:
              raise RuntimeError('Source archive SHA256 mismatch')
          expected = set(json.loads('[".gitattributes",".github/workflows/ci.yml",".github/workflows/release.yml",".gitignore","LICENSE","README.md","cmd/geopulse/main_windows.go","docs/ARCHITECTURE.md","docs/CHANGELOG.md","docs/VALIDATION.md","docs/screenshots/README.md","go.mod","internal/app/engine.go","internal/app/engine_test.go","internal/app/proxy_refresh_test.go","internal/config/config.go","internal/ipinfo/fetch_windows.go","internal/ipinfo/trace.go","internal/ipinfo/trace_test.go","internal/monitor/state.go","internal/monitor/state_test.go","internal/network/egress_windows.go","internal/network/egress_windows_test.go","internal/network/layout_windows_test.go","internal/network/network_windows.go","internal/startup/startup_windows.go","internal/ui/icon_windows_test.go","internal/ui/layout_windows_test.go","internal/ui/presentation.go","internal/ui/presentation_test.go","internal/ui/tray_windows.go","internal/winapi/api_windows.go","internal/winapi/process_windows.go","scripts/build.ps1","scripts/package.ps1","scripts/verify.ps1"]'))
          with zipfile.ZipFile(archive) as source:
              entries = [entry for entry in source.infolist() if not entry.is_dir()]
              if len(entries) != len(expected) or {entry.filename for entry in entries} != expected:
                  raise RuntimeError('Unexpected or missing source archive entries')
              for entry in entries:
                  target = (root / entry.filename).resolve()
                  if not target.is_relative_to(root) or entry.file_size > 1024 * 1024:
                      raise RuntimeError('Unsafe source archive entry')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read(entry))
          print('Verified and extracted 36 source files')
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Test, vet and build both architectures
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Commit verified application sources and remove archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath 'GeoPulse-v0.1.1-source.zip'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # GitHub's built-in token cannot change workflow files.
          # The two final workflows are published through the authenticated browser.
          git add --all -- . ':(exclude).github/workflows'
          git commit -m 'fix: deploy verified v0.1.1 TUN and tray repairs'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Source push failed' }
